[package]
name = "message_worker"
version = "0.7.0"
authors = ["Nick Webster <nick@nick.geek.nz>"]
repository = "https://github.com/NickGeek/message_worker/"
description = "Message Worker is a low-ish level library for Rust for the creation of event-listeners using futures and streams. Notably MW supports non-sync and non-send (i.e. non-thread-safe) contexts within listeners."
readme = "README.md"
edition = "2018"
license = "MPL-2.0"
categories = ["asynchronous", "concurrency"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
name = "benchmarks"
harness = false

[dependencies]
tokio = { version = "^1.53.3", features = ["rt-multi-thread", "sync", "parking_lot"] }
tokio-stream = { version = "~0.1.19", features = ["sync"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "^1.53.3", features = ["rt-multi-thread", "sync", "parking_lot", "macros", "test-util"] }
deno_core = "0.412.0"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
futures = "~0.3.34"
anyhow = "^1.0.104"
